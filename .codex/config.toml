# HGR repository model routing; see MODEL-ROUTING.md.
# Live model selection can override this default.
model = "gpt-6.1-sol"

# GSD Agent Configuration — managed by get-shit-done installer
# GSD codex_hooks ownership: section

[features]
hooks = true

# GSD Agent Configuration — managed by gsd-core installer

[agents]
# Root Sol -> Sol GSD executor -> bounded Luna worker.
max_depth = 2
enabled = true
default_subagent_model = "gpt-6.1-sol"

